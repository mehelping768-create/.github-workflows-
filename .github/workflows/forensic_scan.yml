name: Continuous Forensic Scan

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute forensic scan
        run: |
          python forensic_agent.py --evidence evidence --output manus_report.json

      - name: Upload scan report artifact
        uses: actions/upload-artifact@v4
        with:
          name: manus-report
          path: manus_report.json
